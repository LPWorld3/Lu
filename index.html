<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>路氏族谱</title>
<style>
:root {
  --bg: #f6f1e7;
  --line: #8a6d3b;
  --text: #3d2e1a;
  --accent: #a03d2a;
  --accent2: #2e6b3a;
  --soft: #e9dfc6;
  --ph: #b9a97e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  font-family: "Microsoft YaHei", "PingFang SC", "SimSun", sans-serif;
  color: var(--text);
  text-align: right;
  direction: rtl;
}

/* ================= 世代导航（常驻右侧） ================= */
#genNav {
  position: fixed;
  top: 0; right: 0;
  width: 104px;
  height: 100vh;
  overflow-y: auto; overflow-x: hidden;
  background: #fffdf7;
  border-left: 2px solid var(--line);
  box-shadow: -3px 0 10px rgba(0,0,0,.08);
  z-index: 60;
  padding: 14px 10px;
}
#genNav .navTitle {
  font-size: 13px; font-weight: 700; color: var(--accent);
  padding: 4px 6px 10px; border-bottom: 1px dashed var(--line);
  text-align: center;
}
/* 每个世代 = 独立条目，各自带下划线；整体收在一个模块框里 */
#genLinks {
  border: 1px solid #c9b896; border-radius: 10px;
  overflow: hidden; background: #fffdf9;
}
#genNav a {
  display: block; text-align: center;
  padding: 10px 4px;
  font-size: 14px; color: var(--text); text-decoration: none;
  border-bottom: 1px solid var(--line);
  transition: .15s;
}
#genNav a:last-child { border-bottom: none; }
#genNav a:hover, #genNav a.active { background: var(--soft); color: var(--accent); font-weight: 700; }
/* 总人数栏：点击打开人数统计弹窗 */
#cntToggle {
  margin-top: 12px; padding: 10px 4px; text-align: center; cursor: pointer;
  font-size: 13px; font-weight: 700; color: var(--accent);
  border: 1px solid #c9b896; border-radius: 8px; background: var(--soft);
  user-select: none;
}
#cntToggle:hover { background: var(--accent); color: #fff; }
/* 人数统计弹窗（大弹窗，内容更全） */
#statsView { direction: ltr; text-align: center; }
#statsBody .stSum { font-size: 15px; padding: 2px 0 4px; }
#statsBody .stSum b { color: var(--accent); font-size: 18px; }
#statsBody table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
#statsBody th, #statsBody td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: center; }
#statsBody th { color: var(--accent); background: var(--soft); }
#statsBody tr.totalRow td { font-weight: 700; color: var(--accent); background: var(--soft); }
#statsBody .stNote { font-size: 11px; color: #9a8a6a; margin-top: 8px; text-align: left; }
.dlg.dlgWide { width: min(94vw, 620px); }
/* 添加/编辑表单：加宽弹窗 + 双列网格，信息分左右，尽量一屏完成 */
.dlg.dlgForm { width: min(94vw, 600px); padding: 16px 20px; }
.dlg.dlgForm label { margin: 8px 0 3px; }
#addView .fldGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; align-items: start; }
#addView .fld label { margin-top: 9px; }
#addView .stepper { display: flex; gap: 8px; align-items: center; }
#addView .stepper button { width: 44px; margin: 0; font-size: 18px; line-height: 1.2; }
#addView .stepper span { flex: 1; text-align: center; font-size: 16px; font-weight: 700; color: var(--text); }

/* ================= 世代成员交互浏览 ================= */
/* 弹窗里的成员列表 */
#genMembersList { max-height: 56vh; overflow-y: auto; min-width: 240px; }
.mdItem {
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
  padding: 8px 10px; border-bottom: 1px dashed #e0d3b5;
  cursor: pointer; font-size: 14px; color: var(--text);
}
.mdItem:hover { background: var(--soft); }
.mdItem .mini { font-size: 11px; color: #9a8a6a; white-space: nowrap; }
.mdItem .tag-mini { font-size: 10px; border: 1px solid #8a2a1b; color: #8a2a1b; border-radius: 8px; padding: 0 5px; margin-left: 4px; }
.mdEmpty { text-align: center; color: #9a8a6a; padding: 16px 0; font-size: 13px; }

/* 左侧停靠面板（浏览态的成员列表） */
#memberDock {
  position: absolute; z-index: 40;
  left: 10px; top: 50%; transform: translateY(-50%);
  width: 208px; max-height: 86%;
  overflow-y: auto;
  background: #fffdf7; border: 1.5px solid #c9b896; border-radius: 12px;
  box-shadow: 0 8px 26px rgba(0,0,0,.18);
  padding: 10px 8px;
}
#memberDock .mdHead {
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 700; color: var(--accent); font-size: 13px;
  padding-bottom: 6px; border-bottom: 1px dashed var(--line);
}
#memberDock .mdClose { cursor: pointer; font-size: 11px; color: #9a8a6a; font-weight: 400; }
#memberDock .mdClose:hover { color: var(--accent); }
#memberDock select { width: 100%; margin: 8px 0 4px; font-size: 12px; padding: 4px 6px; }
#memberDock .mdItem { padding: 7px 8px; font-size: 13px; border-radius: 6px; }
#memberDock .mdItem.on { background: var(--accent); color: #fff; border-bottom-color: transparent; }
#memberDock .mdItem.on .mini, #memberDock .mdItem.on .tag-mini { color: #fff; border-color: #fff; }

/* 信息面板右侧停靠态（浏览成员时详情展示在屏幕右侧） */
#infoPanel.dockRight { left: auto !important; right: 14px; }

/* ================= 正文 ================= */
#main {
  margin-right: 120px;   /* 预留导航空间，防遮挡 */
  padding: 20px 28px;
  height: 100vh;
  box-sizing: border-box;
  display: flex; flex-direction: column;   /* 页头/介绍固定高，树区吃掉剩余高度 */
  overflow: auto;
  direction: rtl; text-align: right;
}
#pageHeader, #introSlot { flex: 0 0 auto; }
/* 页头：标题与按钮一行排布（官网式左右两模块，无分隔线） */
#pageHeader {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: nowrap;
  margin-bottom: 20px;
}
#main h1 {
  font-size: 26px; color: var(--accent); font-weight: 700;
  border-bottom: none;              /* 去掉分隔线 */
  margin-bottom: 0;
  white-space: nowrap;
}
#introSlot {
  background: #fdfaf1;
  border: 2px dashed #c9b896;
  border-radius: 12px;
  padding: 18px 20px;
  margin: 0 auto 22px;            /* 框居中 */
  color: #a08c62; font-size: 15px;
  writing-mode: vertical-rl;      /* 古文格式：竖排，列从右往左排 */
  direction: ltr;                 /* 字从上往下写（每列顶部起） */
  text-align: start;              /* 上对齐 */
  height: 85px;                   /* 每列恰好5字（15px字＋2px字距）×5 */
  box-sizing: content-box;        /* 高度按内容算，不受全局border-box影响 */
  width: max-content;             /* 框宽随列数自适应，列距拉远后整框居中 */
  max-width: 100%;
  line-height: 4;                 /* 列间距拉远 */
  letter-spacing: 2px;
  overflow: auto;
}
#introSlot .ph { color: var(--ph); }

/* ================= 树区域 ================= */
#treeWrap {
  position: relative;           /* 供世代悬浮标签定位 */
  background: var(--card, #fffdf7);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
  overflow: auto;               /* 树可平移 */
  flex: 1 1 auto; min-height: 260px;   /* 自动吃掉页面剩余高度，底部不留空白条 */
  direction: ltr;               /* 画布内部用绝对定位，方向无关 */
  cursor: grab;                 /* 拖拽平移 */
  touch-action: none;           /* 触屏拖拽由指针事件接管 */
}
#treeWrap.dragging { cursor: grabbing; user-select: none; }
#treeSizer { position: relative; }   /* 尺寸 = 画布 × 缩放比例，负责撑出滚动范围 */
#tree { position: absolute; left: 0; top: 0; direction: ltr; transform-origin: 0 0; }   /* transform 缩放不占布局 */

/* 世代悬浮标签：悬浮于树视口右上角，随滚动更新，不占版面 */
#genFloat {
  position: absolute; z-index: 30;
  top: 12px; left: 14px;
  background: rgba(255,253,247,.95);
  border: 1.5px solid var(--line); border-radius: 12px;
  padding: 4px 12px; font-size: 13px; font-weight: 700; color: var(--accent);
  pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,.12);
  white-space: nowrap;
}

/* 缩放控件：悬浮于树视口右下角，随滚动更新位置 */
#zoomBar {
  position: absolute; z-index: 30;
  display: flex; align-items: center; gap: 2px;
  background: rgba(255,253,247,.95);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 3px 8px; box-shadow: 0 2px 6px rgba(0,0,0,.12);
  user-select: none;
}
#zoomBar .zbBtn {
  cursor: pointer; font-size: 15px; line-height: 1;
  padding: 4px 9px; color: var(--text); border-radius: 6px;
}
#zoomBar .zbBtn:hover { background: var(--soft); }
#zoomBar .zbFit { font-size: 12px; }
#zoomPct { font-size: 12px; color: #8a6d3b; min-width: 40px; text-align: center; }

/* 人物信息面板：点画布卡片展开（悬浮左下角，随滚动固定） */
#infoPanel {
  position: absolute; z-index: 28;
  min-width: 210px; max-width: 330px;
  background: rgba(255,253,247,.97);
  border: 1.5px solid var(--accent); border-radius: 12px;
  padding: 10px 14px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
}
#infoHead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
#infoHead b { font-size: 16px; color: var(--accent); }
#infoClose { cursor: pointer; color: #8a6d3b; font-size: 14px; padding: 2px 6px; }
#infoClose:hover { color: var(--accent); }
#infoBody .ir { font-size: 13px; line-height: 1.9; color: var(--text); word-break: break-all; }
#infoBody .irWarn { color: #c0392b; }
#infoBody .infoBtns { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
#infoBody .infoBtns .delBtn { margin-top: 0; }

/* 人物节点（卡片式，参考截图红框） */
.node {
  position: absolute;
  transform: translate(-50%, -50%);   /* 以 left/top 为卡片正中心，与连线端点严格对齐 */
  text-align: right;                  /* 所有内容靠右对齐（谱牒式） */
  direction: rtl;
  cursor: pointer;
  width: 130px; min-height: 96px; height: auto;   /* 高度自适应：配偶/备注换行后卡片随之撑高 */
  padding: 14px 10px 26px 8px;        /* 底部预留「＋添加子女」按钮空间 */
  line-height: 1.35;
  background: #fffdf7;
  border: 2px solid #d94f3b;          /* 截图红框 */
  border-radius: 4px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
  display: flex; flex-direction: column;
  justify-content: center; align-items: flex-end;
}
.node.root {
  width: auto; height: auto;
  padding: 4px 6px;
  background: transparent;
  border: none;
  box-shadow: none;
}
.node .nm {
  font-size: 20px; font-weight: 700; color: var(--text);
  white-space: nowrap;
}
.node.root .nm { font-size: 24px; }
.node .kids { font-size: 12px; color: #7a6644; font-weight: 400; }
.adoptTag {
  font-size: 10px; color: #fff; background: #8a6d3b;
  border-radius: 3px; padding: 1px 5px; margin: 0 4px; font-weight: 400;
}
/* 标记模块：绝子/失传/烈士 等快捷选项（编辑/添加弹窗内） */
.tagChip {
  cursor: pointer; user-select: none; white-space: nowrap;
  font-size: 13px; line-height: 1.4; padding: 4px 12px;
  border: 1px solid #c9b896; border-radius: 14px;
  color: var(--text, #4a3b28); background: transparent;
}
.tagChip.on { background: #8a2a1b; border-color: #8a2a1b; color: #fff; }
/* 卡片上的标记角标（绝子/失传/烈士等） */
.node .tg {
  display: inline-block; font-size: 11px; color: #8a2a1b; font-weight: 600;
  border: 1px solid #8a2a1b; border-radius: 9px; padding: 0 7px; margin-top: 3px;
}
/* 名字下方徽章行：子孙统计与标记角标并排，字体规格一致 */
.node .cardTags { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.node .tgKids { color: #7a6644; border-color: #b09a6e; font-weight: 500; white-space: nowrap; }
/* 继子标注：显示在父子连线上（盖住线段，不占卡片空间） */
.adoptLineTag {
  position: absolute; transform: translate(-50%, -50%);
  font-size: 10px; line-height: 1.4; color: #8a6d3b; font-weight: 600;
  background: var(--card, #fffdf7);   /* 与画布同色，视觉上“嵌”在线里 */
  padding: 0 5px; white-space: nowrap;
  pointer-events: none; z-index: 1;
}
.node .fs {
  font-size: 12px; color: #7a6644; margin-top: 2px;
  white-space: normal; word-break: break-all; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.node .sp {
  font-size: 12px; color: #7a6644; margin-top: 2px;
  white-space: normal; word-break: break-all; overflow: hidden;   /* 多位配偶自动换行 */
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.node .bd {
  font-size: 11px; color: #8a6d3b; margin-top: 1px;
  white-space: normal; word-break: break-all;   /* 生卒文字过长时换行，不横向溢出 */
}
.node .note {
  font-size: 11px; color: #a08c62; margin-top: 1px;
  white-space: normal;              /* 备注自动换行，不再横向溢出卡片 */
  word-break: break-all; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  max-height: 45px;                 /* 最多约3行，防止撑破固定高度卡片 */
}
.node .cardBtns {
  position: absolute; top: 4px; left: 4px;   /* 内容靠右，操作钮放左上避免遮挡 */
  display: flex; gap: 3px;
}
.node .editBtn {
  font-size: 11px; line-height: 1;
  padding: 2px 6px;
  background: var(--accent); color: #fff;
  border-radius: 4px;
  cursor: pointer; opacity: .9;
}
.node .editBtn:hover { opacity: 1; background: #8a2a1b; }
.node .cardDelBtn {
  font-size: 11px; line-height: 1;
  padding: 2px 6px;
  background: #c0392b; color: #fff;
  border-radius: 4px;
  cursor: pointer; opacity: .9;
}
.node .cardDelBtn:hover { opacity: 1; background: #a5281c; }
/* 待录占位卡右上角的 ✕：点击直接移除该空槽 */
.node .phDel {
  position: absolute; top: 3px; right: 5px;
  font-size: 11px; line-height: 1;
  padding: 1px 5px;
  background: #c0392b; color: #fff;
  border-radius: 4px;
  cursor: pointer; opacity: .8;
}
.node .phDel:hover { opacity: 1; background: #a5281c; }
/* 人物卡下部的「＋」：直接为该人添加子女 */
.node .cardAdd {
  position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
  font-size: 12px; line-height: 1;
  padding: 2px 9px;
  background: var(--accent); color: #fff;
  border-radius: 9px;
  cursor: pointer; opacity: .75;
}
.node .cardAdd:hover { opacity: 1; background: #8a2a1b; }

/* 备份提示条 */
#toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  background: #3d2b1f; color: #fff; font-size: 13px;
  padding: 10px 18px; border-radius: 8px;
  opacity: 0; pointer-events: none; transition: opacity .3s;
  z-index: 999; max-width: 82vw;
}
#toast.show { opacity: .95; }
.node:hover { border-color: #a03d2a; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
/* 查询定位：目标卡片高亮闪烁 */
.node.locate-flash {
  border-color: #8a2a1b;
  box-shadow: 0 0 0 5px rgba(217, 79, 59, .4), 0 2px 12px rgba(0,0,0,.25);
}
.node.ph {
  background: transparent;
  border-style: dashed;
  border-color: var(--ph);
}
.node.ph .nm {
  color: var(--ph);
  font-weight: 400;
  font-size: 14px;
}
.node.ph:hover { border-color: var(--accent); }
.node.ph:hover .nm { color: var(--accent); }

/* 世代行标签（每行最右侧） */
.genTag {
  position: absolute;
  transform: translateY(-50%);
  font-size: 12px; color: #8a6d3b; font-weight: 700;
  background: var(--soft); border: 1px solid #c9b896;
  border-radius: 8px; padding: 2px 8px;
  white-space: nowrap; pointer-events: none;
}

/* ================= 弹窗 ================= */
.mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.42);
  z-index: 100;
  display: none; align-items: center; justify-content: center;
}
.mask.show { display: flex; }
.dlg {
  background: #fffdf7;
  border-radius: 16px;
  padding: 22px 24px;
  width: min(92vw, 440px);
  max-height: 86vh; overflow-y: auto;
  box-shadow: 0 12px 44px rgba(0,0,0,.28);
  text-align: right; direction: rtl;
}
.dlg h2 { font-size: 19px; color: var(--accent); margin-bottom: 16px; text-align: right; }
.dlg label { display: block; font-size: 13px; color: #7a6644; margin: 12px 0 4px; text-align: right; }
.dlg input, .dlg select {
  width: 100%; padding: 9px 12px;
  border: 1.5px solid #c9b896; border-radius: 9px;
  font-size: 15px; outline: none; background: #fff; text-align: right;
}
.dlg input:focus { border-color: var(--accent); }
.dlgBtns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.dlgBtns button {
  padding: 9px 22px; border: none; border-radius: 20px; cursor: pointer;
  font-size: 15px; background: var(--accent); color: #fff;
}
.dlgBtns button.ghost { background: transparent; color: var(--text); border: 1.5px solid #c9b896; }
.dlgBtns button.primary { background: var(--accent2); }
.dlgBtns button:hover { opacity: .88; }

.menuBtns { display: flex; flex-direction: column; gap: 14px; }
.menuBtns button {
  padding: 16px; font-size: 18px; font-weight: 700;
  border: 2px solid var(--line); border-radius: 14px; cursor: pointer;
  background: var(--soft); color: var(--text);
}
.menuBtns button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

#queryResult {
  margin-top: 14px; border-top: 1px dashed #d9c9a3; padding-top: 12px;
  font-size: 14px; line-height: 2; text-align: right;
}
#queryResult .hit {
  background: #fbf7ec; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 10px;
}
#queryResult .hit b { color: var(--accent); font-size: 16px; }
#queryResult .none { color: var(--ph); }
.delBtn {
  display: inline-block; margin-top: 6px;
  padding: 3px 14px; border-radius: 12px;
  background: #c0392b; color: #fff; font-size: 12px; cursor: pointer;
}
.delBtn:hover { opacity: .85; }
/* 查询定位按钮：覆盖 delBtn 红色，改用蓝色 */
.locateBtn {
  background: #2c5f8a;
  margin-top: 8px;
  padding: 4px 16px;
}
.locateBtn:hover { background: #234d70; opacity: 1; }

#toolbar { display: flex; align-items: center; flex-wrap: nowrap; gap: 10px; }
#toolbar button {
  padding: 9px 20px; border: none; border-radius: 20px; cursor: pointer;
  font-size: 15px; background: var(--accent); color: #fff;
}
#toolbar button.ghost { background: transparent; color: var(--text); border: 1.5px solid #c9b896; }
.fToggle {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; font-size: 14px; color: var(--text);
  background: transparent; border: 1.5px solid #c9b896; border-radius: 20px;
  cursor: pointer; user-select: none;
}
.fToggle input { accent-color: var(--accent); margin: 0; cursor: pointer; }

/* ================= 响应式 ================= */
@media (max-width: 768px) {
  #genNav {
    top: 0; right: 0; left: 0;
    width: 100%; height: 46px;
    display: flex; align-items: center;
    overflow-x: auto; overflow-y: hidden;
    padding: 0 10px; gap: 8px;
    border-left: none; border-bottom: 2px solid var(--line);
    white-space: nowrap;
  }
  #genNav .navTitle { display: none; }

<script>
/* ============================================================
   数据结构（清晰、易扩展）
   ------------------------------------------------------------
   GENEALOGY.surname         姓氏（页面不显示，仅存档）
   GENEALOGY.introText       预留文本位置的内容（为空显示占位提示）
   GENEALOGY.generations[]   世代数组，自上而下排列
     .title                  世代标题，如“第一世”
     .people[]               该世代人物数组
       .givenName            名字（不含姓）
       .spouse               配偶，如“赵氏”
       .note                 备注（可选）
       .sons[]               子嗣列表（占位 = givenName 为空）
         .givenName          儿子/女儿名字；留空显示“待录”占位节点
         .sex                性别：'m' 男 / 'f' 女（默认 m；决定“长子/长女”称谓与几子几女统计）

   补充示例（添加第二世，会自动与第一世的 sons 占位对应）：
   generations.push({
     title: '第二世',
     people: [{ givenName: '长子名', spouse: '配某氏', note: '', sons: [] }],
   });
   ============================================================ */
const GENEALOGY = window.ZUPU_DATA;;;;;;;;;;;;;;

const LS_KEY = 'zupu_data_v4';       // v4：初始数据更新（祖源记文等）可透传进浏览器旧缓存
const LS_KEY_OLD = 'zupu_data_v3';   // v3 键弃用，读取后迁移写入 v4
/* 只读发布模式：true 时页面仅展示数据，隐藏添加/编辑/删除/备份等所有入口，
   数据改由外部 data.js 提供、不再读写 localStorage（GitHub Pages 发布用，见 build_github.js） */
const READ_ONLY = true;

/* ---------- 数据读写 ---------- */
function loadData() {
  if (READ_ONLY) return migrate(JSON.parse(JSON.stringify(window.ZUPU_DATA || GENEALOGY)), false);
  let d, fromOld = false;
  try {
    const saved = JSON.parse(localStorage.getItem(LS_KEY));
    if (saved && Array.isArray(saved.generations)) d = saved;
  } catch (e) {}
  if (!d) {
    try {
      const old = JSON.parse(localStorage.getItem(LS_KEY_OLD));
      if (old && Array.isArray(old.generations)) { d = old; fromOld = true; }
    } catch (e) {}
  }
  if (!d) d = JSON.parse(JSON.stringify(GENEALOGY));
  /* 介绍文字为空时，用初始数据里的最新内容补上（否则旧缓存会一直盖住新填的祖源记文） */
  if ((!d.introText || !String(d.introText).trim()) && GENEALOGY.introText) d.introText = GENEALOGY.introText;
  return migrate(d, fromOld);
}
/* 迁移：子嗣位（sons）里只放「子」——
   1) 未命名的女性占位一律清除（旧版误判产物）；
   2) 旧版本数据带来的「女」计数一并清零（用户确认：下方子女不出意外都是子）；
   3) 正常使用中新设置的女儿数量不受影响（仅从旧版本迁移时清零）。 */
function migrate(d, fromOld) {
  d.generations.forEach(g => (g.people || []).forEach(p => {
    if (!Array.isArray(p.sons)) p.sons = [];
    /* 先清除女性占位残留（旧版误判产物），再把剩余未命名占位一律视为「子」 */
    p.sons = p.sons.filter(s => s.sex !== 'f' || s.givenName);
    p.sons.forEach(s => { if (!s.givenName) s.sex = 'm'; });
    if (fromOld) p.daughters = 0;
    if (p.daughters == null) p.daughters = 0;
  }));
  return d;
}
let DATA = loadData();
let EDITING = null;   // {gi, pi} 编辑模式，null 为添加模式
let ADD_SI = null;    // 从占位点击进入时记录的儿子槽位序号（精确绑定）
function saveData() {
  if (READ_ONLY) return;   // 发布版数据由 data.js 提供，前端不落盘
  localStorage.setItem(LS_KEY, JSON.stringify(DATA));
  scheduleAutoBackup();   // 已绑定备份文件时，改动后静默自动写入（不弹任何框）
}

/* ============================================================
   树构建与布局（横平竖直连线）
   ============================================================ */
function buildTree() {
  // 节点: { id, name, gen, father, spouse, isPh, gi, pi, si, person }
  const nodes = [];
  const byKey = {};
  const claimed = new Set();   // 已被父系条目认领的正式人物 key（g{gi}p{pi}）
  DATA.generations.forEach((g, gi) => {
    g.people.forEach((p, pi) => {
      const id = 'g' + gi + 'p' + pi;
      byKey[id] = { id, name: p.givenName, gen: gi, father: null,
                    spouse: p.spouse || '', note: p.note || '',
                    isPh: false, gi, pi, si: null, person: p, adopt: !!p.adopt };
      nodes.push(byKey[id]);
    });
  });
  // sons → 子节点（填名则关联下一世代同名人物，否则占位节点）
  // 特例：同胞同名——同一父亲可有多个同名条目，按顺序各自认领一个未认领的同名正式人物
  DATA.generations.forEach((g, gi) => {
    g.people.forEach((p, pi) => {
      (p.sons || []).forEach((s, si) => {
        const fid = 'g' + gi + 'p' + pi;
        if (s.givenName) {
          const next = DATA.generations[gi + 1];
          const idx = next ? next.people.findIndex((x, xi) =>
            x.givenName === s.givenName && !claimed.has((gi + 1) + 'p' + xi)) : -1;
          if (idx >= 0) {
            claimed.add((gi + 1) + 'p' + idx);
            byKey['g' + (gi + 1) + 'p' + idx].father = fid;
          } else {
            const id = 's' + gi + '_' + pi + '_' + si;
            nodes.push({ id, name: s.givenName, gen: gi + 1, father: fid,
                         spouse: '', note: '', isPh: false, gi, pi, si, sex: s.sex, person: null, adopt: !!s.adopt });
          }
        } else {
          const id = 's' + gi + '_' + pi + '_' + si;
          nodes.push({ id, name: '', gen: gi + 1, father: fid,
                       spouse: '', note: '', isPh: true, gi, pi, si, sex: s.sex, person: null });
        }
      });
    });
  });
  return nodes;
}

/* 找出「认领」某正式人物的父系条目（与 buildTree 融合逻辑一致）。
   返回 { fgi, fpi, si }；无父系连线时返回 null。
   同名人物场景下，只有这条条目属于本人——删除/改名只准动它，
   否则会误清其他同名人物（如始祖支系）的父系连线。 */
function findClaimingEntry(gi, pi) {
  const claimed = new Map();   // 'g{gi}p{pi}' -> { fgi, fpi, si }
  DATA.generations.forEach((g, ggi) => g.people.forEach((p, pi) => (p.sons || []).forEach((s, si) => {
    if (!s.givenName) return;
    const next = DATA.generations[ggi + 1];
    const idx = next ? next.people.findIndex((x, xi) => x.givenName === s.givenName && !claimed.has((ggi + 1) + 'p' + xi)) : -1;
    if (idx >= 0) claimed.set((ggi + 1) + 'p' + idx, { fgi: ggi, fpi: pi, si });
  })));
  return claimed.get(gi + 'p' + pi) || null;
}

function layoutTree(nodes) {
  const childrenMap = new Map();
  nodes.forEach(n => {
    if (n.father) {
      if (!childrenMap.has(n.father)) childrenMap.set(n.father, []);
      childrenMap.get(n.father).push(n.id);
    }
  });
  /* 关键修正：兄弟顺序以父亲 sons 数组为准（首位=长子=显示最右）。
     节点遍历序是「正式人物数组序 + 子嗣条目序」的混排：
     弹窗新增的人 push 在下一代 people 末尾、占位/未登记兄弟又是按 sons 序，
     两者混排时兄弟次序会乱——这正是「长子没在最右」的根因。 */
  const nodeById = {};
  nodes.forEach(n => nodeById[n.id] = n);
  childrenMap.forEach((kids, fid) => {
    const fm = /^g(\d+)p(\d+)$/.exec(fid);
    if (!fm) return;
    const fp = DATA.generations[+fm[1]] && DATA.generations[+fm[1]].people[+fm[2]];
    if (!fp || !Array.isArray(fp.sons)) return;
    const orderOf = n => (n.si != null) ? n.si : fp.sons.findIndex(s => s.givenName === n.name);
    kids.sort((a, b) => orderOf(nodeById[a]) - orderOf(nodeById[b]));
  });
  let leaf = 0;
  const xpos = new Map();
  function place(id) {
    const kids = childrenMap.get(id) || [];
    if (!kids.length) { xpos.set(id, leaf++); return; }
    // 长子靠右：兄弟从后往前分配叶序（先分配的靠左）
    kids.slice().reverse().forEach(place);
    xpos.set(id, kids.reduce((s, k) => s + xpos.get(k), 0) / kids.length);
  }
  // 根节点分配：
  // · 主系根（第0世始祖等）保持原顺序（世代先后），占据右侧；
  // · 新增的「上一世无父系连线」人物（第1世起无父亲的正式人物）全部排在主系左侧，
  //   且按新增顺序从右往左排——先加的紧贴主树最左端，后加的依次向左延伸。
  const roots = nodes.filter(n => !n.father);
  const mainRoots = [], orphanRoots = [];
  roots.forEach(r => (r.person && r.gen > 0 ? orphanRoots : mainRoots).push(r));
  mainRoots.sort((a, b) => a.gen - b.gen || a.gi - b.gi || a.pi - b.pi);
  /* 孤儿排序：先按添加顺序号 aseq（越后加越靠左 = 画布最左）；
     父亲占位不另起新序——无 aseq 时整体参考长子（首位已录名子嗣）的
     aseq / 世代 / 序号，即整支家族保持在长子原先的位置
     （如 桧 继承 天锡 → 全画布最左；好 继承 天金 → 排在 茂 的右边）；
     都没有参考（视为0=最早）再按 世代降序 / pi降序 */
  const refOf = n => {
    if (!n.person) return { aseq: 0, gen: n.gen, pi: n.pi };
    if (n.person.aseq != null) return { aseq: n.person.aseq, gen: n.gen, pi: n.pi };
    const next = DATA.generations[n.gen + 1];
    if (next && Array.isArray(n.person.sons)) {
      for (const s of n.person.sons) {
        if (!s.givenName) continue;
        const c = next.people.find(x => x.givenName === s.givenName);
        if (c) return { aseq: (c.aseq != null ? c.aseq : 0), gen: n.gen + 1, pi: next.people.indexOf(c) };
      }
    }
    return { aseq: 0, gen: n.gen, pi: n.pi };
  };
  orphanRoots.sort((a, b) => refOf(b).aseq - refOf(a).aseq || refOf(b).gen - refOf(a).gen || refOf(b).pi - refOf(a).pi);   // 越后加越靠左
  orphanRoots.forEach(r => place(r.id));
  mainRoots.forEach(r => place(r.id));
  return { xpos, childrenMap };
}

const SLOT_W = 150, GEN_H = 170, PAD_X = 120, PAD_Y = 90;
let CUR_PAD_X = PAD_X, CUR_PAD_Y = PAD_Y;   // render 时按显示区大小动态调整（画布撑满+内容居中）
let ROW_TOPS = [], MAX_ROW_H = GEN_H;       // 动态行高：每行顶部偏移与最大行高（供缩放/世代悬浮用）
let TOTAL_PEOPLE = 0;                       // 当前登记总人数（世代悬浮标签展示）

function render() {
  /* 浏览态校验：被浏览的人被删/迁移后自动退出，列表高亮随数据刷新 */
  if (BROWSE) {
    const bp = DATA.generations[BROWSE.gi] && DATA.generations[BROWSE.gi].people[BROWSE.pi];
    if (BROWSE.pi == null || !bp) exitBrowse();
    else renderGenMembersList(BROWSE.gi, 'dockList', BROWSE.pi);
  }
  /* 世代导航 */
  const links = document.getElementById('genLinks') || document.getElementById('genNav');
  links.querySelectorAll('a').forEach(a => a.remove());
  const maxGen = Math.max(0, ...DATA.generations.map((g, i) => i), 0);
  /* 当前登记总人数（正式人物数，随每次渲染/增删改自动刷新，显示在世代悬浮标签与左侧总人数栏） */
  TOTAL_PEOPLE = DATA.generations.reduce((s, g) => s + (g.people || []).length, 0);
  const cntTotal = document.getElementById('cntTotal');
  if (cntTotal) cntTotal.textContent = TOTAL_PEOPLE;
  const treeNodes = buildTree();
  const genMax = Math.max(...treeNodes.map(n => n.gen), maxGen);
  /* 女性名字开关：关闭时不显示「子嗣条目里的女性」节点（正式登记的女性人物不受影响），只计入数量 */
  const showF = SHOW_FEMALE();
  const visNodes = showF ? treeNodes : treeNodes.filter(n => n.sex !== 'f' || n.person != null);
  for (let i = 0; i <= genMax; i++) {
    const a = document.createElement('a');
    a.href = '#genrow' + i;
    a.textContent = (DATA.generations[i] && DATA.generations[i].title) || genTitleOf(i + 1);
    a.onclick = () => openGenMembers(i);   // 点世代 → 成员列表弹窗（交互浏览第一步）
    links.appendChild(a);
  }

  /* 预留文本位置 */
  const intro = document.getElementById('introSlot');
  intro.innerHTML = DATA.introText
    ? DATA.introText
    : '<span class="ph">【预留位置】此处后续填入一段介绍文字。</span>';

  /* 树画布 */
  const { xpos } = layoutTree(visNodes);
  const byId = {};
  treeNodes.forEach(n => byId[n.id] = n);
  const maxSlot = Math.max(0, ...xpos.values());
  /* 横向留白：内容不足时在画布内居中（纵向留白需先测卡片高度，见下方二次布行） */
  const wrap = document.getElementById('treeWrap');
  const availW = Math.max(0, (wrap.clientWidth || 0) - 2);
  const availH = Math.max(0, (wrap.clientHeight || 0) - 2);
  const contentW = (maxSlot + 1) * SLOT_W;
  let padX = PAD_X;
  if (contentW + PAD_X * 2 < availW) padX = (availW - contentW) / 2;
  CUR_PAD_X = padX;

  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  hideInfo();                    // 数据/结构刷新后旧信息面板作废
  const cxOf = id => padX + xpos.get(id) * SLOT_W + SLOT_W / 2;   // 中心 x
  const ROOT_H = 60, CARD_H = 96;                                    // 节点整高（与 CSS .node height 一致）
  const nodeHalfH = n => n.gen === 0 ? ROOT_H / 2 : CARD_H / 2;

  /* 第一遍：节点先入画布（top 暂置 0），挂出真实内容后测量实际高度 */
  const nodeDivs = {};
  const byGen = {};              // 世代 -> 该行卡片元素
  for (const n of visNodes) {
    const div = document.createElement('div');
    div.className = 'node' + (n.isPh ? ' ph' : '') + (n.gen === 0 ? ' root' : '');
    div.id = 'znode-' + n.id;          // 供查询定位 scrollIntoView 使用
    div.style.left = cxOf(n.id) + 'px';
    div.style.top = '0px';
    /* 几子几女：完全根据已填写内容统计，只读展示、不可调整；
       仅「无后」类标记（绝子/失传等）时不显示，避免语义矛盾；烈士与子女不冲突，照常显示。
       展示位置与「标记」角标一致：名字下方徽章行，字体规格相同 */
    let kidsTxt = '';
    if (n.person && !isNoIssueTag(n.person.tag)) {
      const ks = kidsStats(n.person);
      if (ks.sons + ks.daughters > 0) {
        /* 卡片展示规则：格式「X子X女」；未设置女的数量则只显示 X子；
           补充：只有女没有子时不显示「子」，只显示 X女 */
        const showDau = ks.daughters > 0 && (n.person.daughterCount != null || ks.sons === 0);
        kidsTxt = (ks.sons > 0 ? ks.sons + '子' : '') + (showDau ? ks.daughters + '女' : '');
      }
    }
    const bdTxt = n.person ? [n.person.birth, n.person.death].filter(Boolean).join(' – ') : '';
    const editBtn = (!READ_ONLY && !n.isPh) ? `<span class="editBtn" onclick="openEdit(${n.gi},${n.pi}); event.stopPropagation();">编辑</span>` : '';
    const cardDelBtn = (!READ_ONLY && !n.isPh) ? `<span class="cardDelBtn" title="删除此人（父系条目恢复占位）" onclick="delPerson(${n.gi},${n.pi}); event.stopPropagation();">删除</span>` : '';
    const cardAddBtn = (!READ_ONLY && !n.isPh) ? `<span class="cardAdd" title="为「${esc(n.name)}」添加子女" onclick="openAdd(${n.gi},${n.pi}); event.stopPropagation();">＋</span>` : '';
    div.innerHTML = n.isPh
      ? `${!READ_ONLY ? `<span class="phDel" title="删除此占位" onclick="delPh(${n.gi},${n.pi},${n.si}); event.stopPropagation();">✕</span>` : ''}<div class="nm">${ordOfSons(n.gi, n.pi, n.si)}（待录）</div>`
      : `${(editBtn || cardDelBtn) ? `<span class="cardBtns">${editBtn}${cardDelBtn}</span>` : ''}<div class="nm">${esc(n.name)}</div>
         ${(kidsTxt || (n.person && n.person.tag)) ? `<div class="cardTags">${kidsTxt ? `<span class="tg tgKids">${kidsTxt}</span>` : ''}${n.person && n.person.tag ? `<span class="tg">${esc(n.person.tag)}</span>` : ''}</div>` : ''}
         ${n.person && n.person.post ? `<div class="sp">${esc(n.person.post)}</div>` : ''}
         ${n.person && n.person.fson ? `<div class="fs">${esc(n.person.fson)}之子</div>` : ''}
         ${n.person && n.person.zi ? `<div class="sp">字 ${esc(n.person.zi)}</div>` : ''}
         ${n.spouse ? `<div class="sp">配 ${esc(n.spouse)}</div>` : ''}
         ${bdTxt ? `<div class="bd">${esc(bdTxt)}</div>` : ''}
         ${n.note ? `<div class="note">${esc(n.note)}</div>` : ''}
         ${cardAddBtn}`;
    if (n.isPh) {
      div.onclick = READ_ONLY ? null : () => openAdd(n.gi, n.pi, n.si);
      if (READ_ONLY) div.style.cursor = 'default';
    } else if (n.person) {
      div.onclick = () => showInfo(n.gi, n.pi);        // 点卡片 → 展开信息面板（查询只用顶部按钮）
    } else {
      div.onclick = () => showInfoSon(n.gi, n.pi, n.si);   // 未登记的名条 → 展开挂线信息
    }
    tree.appendChild(div);
    nodeDivs[n.id] = div;
    (byGen[n.gen] = byGen[n.gen] || []).push(div);
  }

  /* 第二遍：按行动态行高——每行取该行最高卡片 + 行间距，行高下限 GEN_H，
     内容多的行自动加高，行与行不再重叠 */
  const ROW_GAP = 36;
  const rowH = [], rowTop = [];
  let acc = 0;
  for (let g = 0; g <= genMax; g++) {
    let h = GEN_H;   // 行高下限（jsdom/测量失败时保持原行距）
    (byGen[g] || []).forEach(d => { if (d.offsetHeight > h) h = d.offsetHeight; });
    if (h > GEN_H) h += ROW_GAP;
    rowH.push(h); rowTop.push(acc); acc += h;
  }
  ROW_TOPS = rowTop;
  MAX_ROW_H = Math.max(GEN_H, ...rowH);
  const contentH = acc;
  let padY = PAD_Y;
  if (contentH + PAD_Y * 2 < availH) padY = (availH - contentH) / 2;
  CUR_PAD_Y = padY;            // 供世代悬浮标签定位使用
  const W = Math.max(contentW + padX * 2, availW);
  const H = Math.max(contentH + padY * 2, availH);
  tree.style.width = W + 'px';
  tree.style.height = H + 'px';
  TREE_W = W; TREE_H = H;      // 供缩放上下限计算（fit / 一屏三行）
  const cyOf = gen => padY + (rowTop[gen] || 0) + rowH[gen] / 2;   // 行中心 y
  /* 二次定位：卡片落到各自行的中心 */
  for (const n of visNodes) nodeDivs[n.id].style.top = cyOf(n.gen) + 'px';

  /* 画布层：SVG 连线层（插到卡片下方，保持连线在卡片之下的层级） */
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.style.position = 'absolute'; svg.style.left = '0'; svg.style.top = '0';
  svg.style.pointerEvents = 'none';
  tree.insertBefore(svg, tree.firstChild);
  /* 卡片半高：优先用实际渲染高度（内容换行撑高后连线仍贴合卡片边缘），取不到时回退常量 */
  const halfOf = n => {
    const el = nodeDivs[n.id];
    const h = el && el.offsetHeight;
    return h ? h / 2 : nodeHalfH(n);
  };

  /* 连线（横平竖直：竖→横→竖） */
  for (const n of visNodes) {
    if (!n.father) continue;
    const parent = byId[n.father];
    const fx = cxOf(n.father), cx = cxOf(n.id);
    const fy = cyOf(parent.gen) + halfOf(parent);
    const ty = cyOf(n.gen) - halfOf(n);
    const midY = (fy + ty) / 2;
    const d = `M${fx} ${fy} V${midY} H${cx} V${ty}`;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('stroke', n.isPh ? '#c9b896' : '#8a6d3b');
    path.setAttribute('stroke-width', '1.6');
    path.setAttribute('fill', 'none');
    if (n.isPh) path.setAttribute('stroke-dasharray', '6 5');
    svg.appendChild(path);
    /* 继子标注：显示在父子连线的中段（不放进卡片里） */
    if (n.adopt && !n.isPh) {
      const tag = document.createElement('div');
      tag.className = 'adoptLineTag';
      tag.textContent = '继子';
      tag.style.left = ((fx + cx) / 2) + 'px';
      tag.style.top = midY + 'px';
      tree.appendChild(tag);
    }
  }


  /* 世代行标签（每行最右侧） */
  for (let g = 0; g <= genMax; g++) {
    const tag = document.createElement('div');
    tag.className = 'genTag';
    tag.textContent = (DATA.generations[g] && DATA.generations[g].title) || genTitleOf(g + 1);
    tag.style.right = '14px';
    tag.style.top = cyOf(g) + 'px';
    tree.appendChild(tag);
  }

  /* 同步女性名字开关的界面状态 */
  const chk = document.getElementById('fToggleChk');
  if (chk) chk.checked = showF;
  const mb = document.getElementById('fToggleMenu');
  if (mb) mb.textContent = showF ? '👧 女性名字：显示中' : '👧 女性名字：不显示（只计数）';

  /* 添加/编辑表单下拉（重建时保留当前选中值——编辑弹窗打开期间 render 不得重置世代/父亲，
     否则保存时会把被清空的选中值写回数据，导致父系条目被删、世代被移动） */
  const aGen = document.getElementById('aGen');
  const prevGenVal = aGen.value;
  aGen.innerHTML = '';
  DATA.generations.forEach((g, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = g.title;
    aGen.appendChild(o);
  });
  const o2 = document.createElement('option');
  o2.value = 'new'; o2.textContent = '新建下一世';
  aGen.appendChild(o2);
  if ([...aGen.options].some(o => o.value === prevGenVal)) aGen.value = prevGenVal;

  const aFather = document.getElementById('aFather');
  const prevFatherVal = aFather.value;
  aFather.innerHTML = '<option value="">— 无 —</option>';
  DATA.generations.forEach((g, gi) => g.people.forEach((p, pi) => {
    const o = document.createElement('option');
    o.value = gi + ':' + pi;
    o.textContent = g.title + ' · ' + p.givenName;
    aFather.appendChild(o);
  }));
  if ([...aFather.options].some(o => o.value === prevFatherVal)) aFather.value = prevFatherVal;

  /* 缩放视图：保持当前比例（按新画布尺寸重新夹取上下限）并同步滚动范围 */
  applyZoom();
  /* 世代悬浮标签 */
  updateGenFloat();
}

/* ---------- 总人数栏：点击打开人数统计弹窗 ----------
   统计口径与卡片一致：正式登记人物（男/女均计）；
   配偶仅为卡片展示文字、未登记为正式人物，不计入人数。
   女列只有该世代有女性时才显示数字，否则显示 — */
function openStatsDialog() {
  let total = 0, tm = 0, tf = 0;
  const rows = DATA.generations.map(g => {
    const ps = g.people || [];
    let m = 0, f = 0;
    ps.forEach(p => { if ((p.sex || 'm') === 'f') f++; else m++; });
    total += ps.length; tm += m; tf += f;
    return `<tr><td>${esc(g.title)}</td><td>${ps.length}</td><td>${m}</td><td>${f > 0 ? f : '—'}</td></tr>`;
  }).join('');
  document.getElementById('statsBody').innerHTML =
    `<div class="stSum">当前登记 <b>${total}</b> 人（男 ${tm}${tf > 0 ? ' · 女 ' + tf : ''}）</div>` +
    `<table><tr><th>世代</th><th>人数</th><th>男</th><th>女</th></tr>${rows}` +
    `<tr class="totalRow"><td>总计</td><td>${total}</td><td>${tm}</td><td>${tf > 0 ? tf : '—'}</td></tr></table>` +
    `<div class="stNote">注：按正式登记人物统计，男/女均计入；配偶仅为卡片展示文字，未登记为正式人物不计入。</div>`;
  switchView('statsView'); showDlg();
}

/* ================= 世代成员交互浏览 =================
   三步状态切换：
   ① 点世代 → 弹窗列出该世代全部成员（居中模态）；
   ② 点成员 → 弹窗收起，成员列表停靠屏幕左侧（可换世代/换人），主视图把该成员卡片
      定位居中到「左停靠面板与右详情之间」的可见区域；
   ③ 屏幕右侧固定展示该成员详情；再点列表其他人 → ②③刷新；点「收起 ✕」→ 退出浏览态。 */
let BROWSE = null;   // { gi, pi } 当前浏览的成员

/* ① 世代弹窗：成员列表 */
function openGenMembers(gi) {
  const g = DATA.generations[gi];
  if (!g) return;
  renderGenMembersList(gi, 'genMembersList', null);
  switchView('genMembersView'); showDlg();
  document.getElementById('dlgTitle').textContent = g.title + ' · 成员（' + (g.people || []).length + '人）';
}
function renderGenMembersList(gi, containerId, curPi) {
  const g = DATA.generations[gi];
  const box = document.getElementById(containerId);
  if (!g || !box) return;
  const ps = g.people || [];
  box.innerHTML = ps.length ? ps.map((p, pi) =>
    `<div class="mdItem${pi === curPi ? ' on' : ''}" onclick="pickMember(${gi},${pi})">` +
    `<span>${esc(p.givenName)}${p.tag ? ` <span class="tag-mini">${esc(p.tag)}</span>` : ''}</span>` +
    `<span class="mini">${[p.fson ? esc(p.fson) + '之子' : '', p.zi ? '字' + esc(p.zi) : '', p.post ? esc(p.post) : '', p.spouse ? '配' + esc(p.spouse) : ''].filter(Boolean).join(" · ")}</span></div>`
  ).join('') : '<div class="mdEmpty">该世代暂无登记成员</div>';
}

/* ② 点成员：停靠左侧 + 主视图定位 */
function pickMember(gi, pi) {
  BROWSE = { gi, pi };
  closeDlg();                       // 收起居中弹窗
  showMemberDock(gi, pi);           // 列表停靠屏幕左侧
  locateBrowseMember();             // 主视图定位到成员卡片
  showInfo(gi, pi, true);           // ③ 详情固定屏幕右侧
}
function showMemberDock(gi, pi) {
  const dock = document.getElementById('memberDock');
  const g = DATA.generations[gi];
  if (!dock || !g) return;
  dock.innerHTML =
    `<div class="mdHead"><span>${esc(g.title)} · ${(g.people || []).length}人</span>` +
    `<span class="mdClose" onclick="exitBrowse()">收起 ✕</span></div>` +
    `<select onchange="switchBrowseGen(this.value)">${DATA.generations.map((gg, i) =>
      `<option value="${i}"${i === gi ? ' selected' : ''}>${esc(gg.title)}</option>`).join('')}</select>` +
    `<div id="dockList"></div>`;
  renderGenMembersList(gi, 'dockList', pi);
  dock.style.display = 'block';
}
/* 停靠面板内切换世代：只换列表，等用户点选成员后再定位 */
function switchBrowseGen(gi) {
  if (!BROWSE) return;
  BROWSE.gi = +gi; BROWSE.pi = null;
  renderGenMembersList(+gi, 'dockList', null);
  hideInfo();
}
/* 主视图定位：卡片居中于左停靠面板与右详情面板之间的可见区域 */
function locateBrowseMember() {
  if (!BROWSE) return;
  const { gi, pi } = BROWSE;
  const el = document.getElementById('znode-g' + gi + 'p' + pi);
  if (!el) { exitBrowse(); return; }
  const wrap = document.getElementById('treeWrap');
  const dock = document.getElementById('memberDock');
  const ip = document.getElementById('infoPanel');
  const dockW = (dock && dock.style.display !== 'none') ? (dock.offsetWidth || 0) + 24 : 0;
  const infoW = (ip && ip.style.display !== 'none') ? (ip.offsetWidth || 0) + 28 : 0;
  const remain = Math.max(120, wrap.clientWidth - dockW - infoW);
  const centerX = dockW + remain / 2;                     // 可见区域中心（视口坐标）
  const cx = el.offsetLeft * VIEW_SCALE, cy = el.offsetTop * VIEW_SCALE;
  const tx = Math.max(0, cx - centerX);
  const ty = Math.max(0, cy - wrap.clientHeight / 2);
  if (wrap.scrollTo) wrap.scrollTo({ left: tx, top: ty, behavior: 'smooth' });
  else { wrap.scrollLeft = tx; wrap.scrollTop = ty; }
  el.classList.add('locate-flash');
  setTimeout(() => el.classList.remove('locate-flash'), 2200);
  updateGenFloat();
}
/* 退出浏览态：收起停靠面板与详情 */
function exitBrowse() {
  BROWSE = null;
  const dock = document.getElementById('memberDock');
  if (dock) { dock.style.display = 'none'; dock.innerHTML = ''; }
  hideInfo();
}

/* ---------- 世代悬浮展示：标签悬浮于树视口右上，随滚动切换当前世代 ---------- */
function updateGenFloat() {
  const wrap = document.getElementById('treeWrap');
  const gf = document.getElementById('genFloat');
  if (!wrap || !gf) return;
  const genCount = Math.max(DATA.generations.length, 1);
  const mid = (wrap.scrollTop + wrap.clientHeight / 2) / VIEW_SCALE;   // 换算回未缩放画布坐标
  let g = 0;
  for (let i = 0; i < ROW_TOPS.length; i++) { if (mid >= CUR_PAD_Y + ROW_TOPS[i]) g = i; else break; }
  g = Math.max(0, Math.min(genCount - 1, g));
  gf.textContent = ((DATA.generations[g] && DATA.generations[g].title) || genTitleOf(g + 1)) +
    (TOTAL_PEOPLE ? ' · 共' + TOTAL_PEOPLE + '人' : '');
  gf.style.top = (wrap.scrollTop + 12) + 'px';
  gf.style.left = (wrap.scrollLeft + wrap.clientWidth - gf.offsetWidth - 14) + 'px';
  const zb = document.getElementById('zoomBar');
  if (zb) {
    zb.style.top = (wrap.scrollTop + wrap.clientHeight - zb.offsetHeight - 12) + 'px';
    zb.style.left = (wrap.scrollLeft + wrap.clientWidth - zb.offsetWidth - 14) + 'px';
  }
  positionInfoPanel();
}

/* ---------- 视图缩放与拖拽平移 ----------
   缩放范围：下限 = 自适应（一屏看全部内容）；上限 = 一屏约三行世代（行距 GEN_H） */
let VIEW_SCALE = 1, TREE_W = 0, TREE_H = 0;

function zoomLimits() {
  const wrap = document.getElementById('treeWrap');
  const aw = (wrap && wrap.clientWidth) || 800;
  const ah = (wrap && wrap.clientHeight) || 500;
  const fit = Math.min(aw / (TREE_W || aw), ah / (TREE_H || ah));   // 整棵树（含留白）塞进视口
  const max = Math.max(fit, ah / (3 * (MAX_ROW_H || GEN_H)));       // 最大：视口高度 ≈ 3 行（按最高行算）
  return { fit: Math.max(fit, 0.05), max: Math.max(max, 0.05) };
}

function applyZoom() {
  const lim = zoomLimits();
  VIEW_SCALE = Math.min(lim.max, Math.max(lim.fit, VIEW_SCALE));
  const sizer = document.getElementById('treeSizer');
  const tree = document.getElementById('tree');
  if (sizer) {
    sizer.style.width = (TREE_W * VIEW_SCALE) + 'px';
    sizer.style.height = (TREE_H * VIEW_SCALE) + 'px';
  }
  if (tree) tree.style.transform = 'scale(' + VIEW_SCALE + ')';
  const pct = document.getElementById('zoomPct');
  if (pct) pct.textContent = Math.round(VIEW_SCALE * 100) + '%';
}

/* 以视口内某点 (ox,oy) 为锚缩放 f 倍，保持该点内容不动 */
function zoomAt(ox, oy, f) {
  const wrap = document.getElementById('treeWrap');
  if (!wrap) return;
  const lim = zoomLimits();
  const z0 = VIEW_SCALE;
  const z1 = Math.min(lim.max, Math.max(lim.fit, z0 * f));
  if (z1 === z0) { applyZoom(); return; }
  const cx = (wrap.scrollLeft + ox) / z0;
  const cy = (wrap.scrollTop + oy) / z0;
  VIEW_SCALE = z1;
  applyZoom();
  wrap.scrollLeft = Math.max(0, cx * z1 - ox);
  wrap.scrollTop = Math.max(0, cy * z1 - oy);
  updateGenFloat();
}

function zoomBy(f) {
  const wrap = document.getElementById('treeWrap');
  zoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, f);
}

/* 自适应：一屏看全部内容并居中 */
function fitTree() {
  const wrap = document.getElementById('treeWrap');
  if (!wrap) return;
  VIEW_SCALE = zoomLimits().fit;
  applyZoom();
  wrap.scrollLeft = Math.max(0, (TREE_W * VIEW_SCALE - wrap.clientWidth) / 2);
  wrap.scrollTop = Math.max(0, (TREE_H * VIEW_SCALE - wrap.clientHeight) / 2);
  updateGenFloat();
}

/* Ctrl + 滚轮：以鼠标位置为锚缩放；普通滚轮保留默认滚动 */
document.getElementById('treeWrap').addEventListener('wheel', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  const r = document.getElementById('treeWrap').getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

/* 拖拽平移：按住左键拖动即平移视图（移动超 4px 才算拖拽，不影响点卡片/按钮） */
let dragSt = null, dragSuppressed = false;
document.getElementById('treeWrap').addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  if (e.target.closest && e.target.closest('#zoomBar')) return;
  const wrap = document.getElementById('treeWrap');
  dragSt = { x: e.clientX, y: e.clientY, sl: wrap.scrollLeft, st: wrap.scrollTop, moved: false };
});
window.addEventListener('pointermove', e => {
  if (!dragSt) return;
  const wrap = document.getElementById('treeWrap');
  const dx = e.clientX - dragSt.x, dy = e.clientY - dragSt.y;
  if (!dragSt.moved && Math.abs(dx) + Math.abs(dy) > 4) {
    dragSt.moved = true;
    wrap.classList.add('dragging');
  }
  if (dragSt.moved) {
    wrap.scrollLeft = dragSt.sl - dx;
    wrap.scrollTop = dragSt.st - dy;
  }
});
window.addEventListener('pointerup', () => {
  if (dragSt && dragSt.moved) dragSuppressed = true;   // 本次拖拽结束后吞掉误触点击
  if (dragSt) document.getElementById('treeWrap').classList.remove('dragging');
  dragSt = null;
});
document.addEventListener('click', e => {
  if (dragSuppressed) {
    e.stopPropagation(); e.preventDefault();
    dragSuppressed = false;
  }
}, true);

function ordOf(si) {
  return ['长子', '次子', '三子', '四子', '五子', '六子'][si] || ('第' + (si + 1) + '子');
}

/* 子嗣称谓（按性别）：第 k 个儿子=长子/次子…，第 k 个女儿=长女/次女… */
function ordOfSons(gi, pi, si) {
  const g = DATA.generations[gi];
  if (!g) return '待录';
  const p = g.people[pi];
  if (!p) return '待录';
  const s = (p.sons || [])[si];
  if (!s) return '待录';
  const isF = s.sex === 'f';
  let k = 0;
  for (let i = 0; i <= si; i++) {
    if (((p.sons[i].sex === 'f') === isF)) k++;
  }
  const M = ['长子', '次子', '三子', '四子', '五子', '六子'];
  const F = ['长女', '次女', '三女', '四女', '五女', '六女'];
  const arr = isF ? F : M;
  return arr[k - 1] || (isF ? ('第' + k + '女') : ('第' + k + '子'));
}

/* 几子几女统计：完全根据已填写内容（有名有姓的子嗣条目）；
   未填写的待录占位不计入；女性条目计入「女」 */
function kidsStats(p) {
  let sons = 0, daughters = 0;
  (p.sons || []).forEach(s => {
    if (!s.givenName) return;
    if (s.sex === 'f') daughters++; else sons++;
  });
  /* 子/女数可直接调整（继子/未录名者计入数字，不在树上生成节点）：取「录名数」与「声明总数」的较大值 */
  sons = Math.max(sons, p.sonCount || 0);
  daughters = Math.max(daughters, p.daughterCount || 0);
  return { sons, daughters };
}

/* 子女统计文案（信息面板/查询详情共用）：X子X女；只有女没有子时只显示 X女，不显示 0子 */
function kidsLabel(ks) {
  const parts = [];
  if (ks.sons > 0) parts.push(ks.sons + '子');
  if (ks.daughters > 0) parts.push(ks.daughters + '女');
  return parts.join('、');
}

/* 子的数量：直接加减数字（sonCount=声明总数；低于录名子数时不允许再减） */

/* ---------- 标记模块（绝子/失传/烈士等，可手输） ----------

function personHasKids(p) {
  if (!p) return false;

}

function namedSonCount(p) {
  let n = 0;
  (p.sons || []).forEach(s => { if (s.givenName && s.sex !== 'f') n++; });
  return n;
}
function totalSonCount(p) { return Math.max(namedSonCount(p), p.sonCount || 0); }

/* 女的数量：与子的数量同规则（daughterCount=声明总数；低于录名女数时不允许再减） */
function namedDaughterCount(p) {
  let n = 0;
  (p.sons || []).forEach(s => { if (s.givenName && s.sex === 'f') n++; });
  return n;
}
function totalDaughterCount(p) { return Math.max(namedDaughterCount(p), p.daughterCount || 0); }
function refreshDauCountDisp() {
  const el = document.getElementById('dauCountDisp');
  if (!el) return;
  if (!EDITING) { el.textContent = ADD_COUNTS.daughters; return; }   // 添加模式：草稿计数
  const g = DATA.generations[EDITING.gi];
  const p = g && g.people[EDITING.pi];
  if (!p) return;
  el.textContent = totalDaughterCount(p);
}
function adjustDaughterCount(delta) {
  if (!EDITING) {   // 添加模式：调整草稿计数（无录名下限）
    ADD_COUNTS.daughters = Math.max(0, ADD_COUNTS.daughters + delta);
    refreshDauCountDisp();
    return;
  }
  const g = DATA.generations[EDITING.gi];
  const p = g && g.people[EDITING.pi];
  if (!p) return;
  const named = namedDaughterCount(p);
  const next = totalDaughterCount(p) + delta;
  if (next < named) {
    alert(`已有 ${named} 个录名的女，数量不能再减；如需减少请先删除对应人员记录。`);
    return;
  }
  if (next === named) delete p.daughterCount; else p.daughterCount = next;
  saveData();
  refreshDauCountDisp();
  render();
}
function adjustSonCount(delta) {
  if (!EDITING) {   // 添加模式：调整草稿计数（无录名下限）
    ADD_COUNTS.sons = Math.max(0, ADD_COUNTS.sons + delta);
    refreshSonCountDisp();
    return;
  }
  const g = DATA.generations[EDITING.gi];
  const p = g && g.people[EDITING.pi];
  if (!p) return;
  const named = namedSonCount(p);
  const next = totalSonCount(p) + delta;
  if (next < named) {
    alert(`已有 ${named} 个录名的子，数量不能再减；如需减少请先删除对应人员记录。`);
    return;
  }
  if (next === named) delete p.sonCount; else p.sonCount = next;
  saveData();
  refreshSonCountDisp();
  render();

/* 找某正式人物的父系（按 buildTree 的融合结果反查） */
function infoFatherOf(gi, pi) {
  const node = buildTree().find(n => n.id === 'g' + gi + 'p' + pi);
  if (!node || !node.father) return null;
  const m = node.father.match(/^g(\d+)p(\d+)$/);
  if (!m) return null;
  const fg = DATA.generations[+m[1]];
  const fp = fg && fg.people[+m[2]];
  return fp ? { name: fp.givenName, title: fg.title } : null;
}

/* ---------- 数据体检：排查「信息相同却不融合」的方块 ---------- */
function scanDataIssues() {
  const issues = [];
  /* 1. 子嗣条目点了名，但下一世没有同名正式人物；该名字却登记在别的世代（登错世代） */
  /* 注：同一父亲下多个同名条目 = 同胞同名特例，属合法数据，不再作为问题 */
  DATA.generations.forEach((g, gi) => (g.people || []).forEach((p, pi) => (p.sons || []).forEach((s, si) => {
    if (!s.givenName) return;
    const next = DATA.generations[gi + 1];
    if (next && next.people.some(x => x.givenName === s.givenName)) return;
    DATA.generations.forEach((g2, g2i) => {
      if (g2i === gi + 1) return;
      (g2.people || []).forEach((p2, p2i) => {
        if (p2.givenName === s.givenName) {
          issues.push({ type: 'misplaced', gi, pi, si, tgi: g2i, tpi: p2i,
            msg: `「${s.givenName}」挂在 ${g.title}·${p.givenName} 名下，但正式记录登记在${g2.title}（登错世代，未融合）`, fix: true });
        }
      });
    });
  })));
  /* 2. 同一世代有同名正式人物（一个融进父系，另一个可能是孤块） */
  DATA.generations.forEach((g, gi) => {
    const cnt = {};
    (g.people || []).forEach(p => { if (p.givenName) cnt[p.givenName] = (cnt[p.givenName] || 0) + 1; });
    Object.keys(cnt).forEach(k => {
      if (cnt[k] > 1) issues.push({ type: 'dupPerson', gi, name: k,
        msg: `${g.title} 有 ${cnt[k]} 位「${k}」：若为同胞同名属正常；若是重复录入请人工核对删除`, fix: false });
    });
  });
  /* 3. 孤立正式人物：非第一世、没有任何父系连线（树外独立块，如漏挂父亲的录入） */
  const claimed = new Set();
  DATA.generations.forEach((g, gi) => (g.people || []).forEach(p => (p.sons || []).forEach(s => {
    if (!s.givenName) return;
    const next = DATA.generations[gi + 1];
    const idx = next ? next.people.findIndex((x, xi) => x.givenName === s.givenName && !claimed.has((gi + 1) + 'p' + xi)) : -1;
    if (idx >= 0) claimed.add((gi + 1) + 'p' + idx);
  })));
  DATA.generations.forEach((g, gi) => { if (gi === 0) return;
    (g.people || []).forEach((p, pi) => {
      if (!claimed.has(gi + 'p' + pi)) {
        issues.push({ type: 'orphan', gi, pi, canDel: true,
          msg: `「${p.givenName}」在${g.title}但没有父系连线（树外独立块，请确认后删除或挂接父亲）` });
      }
    });
  });
  return issues;
}
/* 清理全部待录占位（无名字的子嗣空槽）：不影响任何已录名人物 */
function cleanupPlaceholders() {
  if (!confirm('确定清除全部「待录」占位条目吗？\n占位只是未录名的空槽，清除不影响任何已录名人物和声明数量。')) return;
  let n = 0;
  DATA.generations.forEach(g => g.people.forEach(p => {
    if (Array.isArray(p.sons)) {
      const before = p.sons.length;
      p.sons = p.sons.filter(s => s.givenName);
      n += before - p.sons.length;
    }
  }));
  saveData(); render(); openCheckup();
  alert(`已清除 ${n} 个待录占位。`);
}
/* 删除树外孤立人物（无父系连线者） */
function delOrphan(gi, pi) {
  const g = DATA.generations[gi];
  const p = g && g.people[pi];
  if (!p) return;
  if (!confirm(`确定删除「${p.givenName}」（${g.title}）吗？\n此人没有父系连线，删除后不可恢复；若其名下挂有子嗣将一并脱离该支。`)) return;
  g.people.splice(pi, 1);
  saveData(); render(); openCheckup();
}
let CHECKUP_ISSUES = [];
function openCheckup() {
  switchView('checkupView'); showDlg();
  CHECKUP_ISSUES = scanDataIssues();
  const box = document.getElementById('checkupResult');
  if (!CHECKUP_ISSUES.length) {
    box.innerHTML = '<div class="none">✅ 体检通过：所有子嗣条目与正式人物均已正确融合，未发现重复或登错世代。</div>';
    return;
  }
  box.innerHTML = '<div class="none">发现 ' + CHECKUP_ISSUES.length + ' 个问题：</div>' +
    CHECKUP_ISSUES.map((it, i) =>
      `<div class="hit"><b>${esc(it.msg)}</b><br>` +
      (it.fix ? `<span class="delBtn locateBtn" onclick="applyFix(${i})">🔧 一键修复</span> ` : '') +
      (it.canDel ? `<span class="delBtn" onclick="delOrphan(${it.gi},${it.pi})">删除此人</span> ` : '') +
      `</div>`).join('');
}
function applyFix(i) {
  const it = CHECKUP_ISSUES[i];
  if (!it) return;
  if (it.type === 'misplaced') {
    const entry = ((DATA.generations[it.gi].people[it.pi] || {}).sons || [])[it.si];
    const from = DATA.generations[it.tgi];
    const person = from && from.people[it.tpi];
    if (!entry || !person || person.givenName !== entry.givenName) return;
    from.people.splice(it.tpi, 1);
    let next = DATA.generations[it.gi + 1];
    if (!next) { next = { title: genTitleOf(it.gi + 2), people: [] }; DATA.generations.push(next); }
    next.people.push(person);   // 移入正确世代，buildTree 按名字自动融合；长幼顺序可用「兄弟排序」微调
  } else return;
  saveData(); render(); openCheckup();
}

function openQuery() {

function doQuery(q) {
  const box = document.getElementById('queryResult');
  const kw = (q || '').trim();
  box.innerHTML = '';
  if (!kw) return;
  const hits = [];
  DATA.generations.forEach((g, gi) => {
    g.people.forEach((p, pi) => {
      if (p.givenName.includes(kw)) hits.push({ g, gi, pi, p });
      (p.sons || []).forEach((s, si) => {
        if (s.givenName && s.givenName.includes(kw)) {
          // 若下一世代已有同名正式人物，跳过（避免与上一条重复）
          const next = DATA.generations[gi + 1];
          const dup = next && next.people.some(x => x.givenName === s.givenName);
          if (!dup) hits.push({ g, gi, pi, p, son: s, si });
        }
      });
    });
  });
  if (!hits.length) {
    box.innerHTML = '<div class="none">未找到「' + esc(kw) + '」</div>';
    return;
  }
  let firstNodeId = null;
  hits.forEach(h => {
    const name = h.son ? h.son.givenName : h.p.givenName;
    const ks = kidsStats(h.p);
    /* 树上对应卡片的节点 id：正式人物=g{gi}p{pi}；未登记子嗣条目=s{gi}_{pi}_{si} */
    const nodeId = h.son ? ('s' + h.gi + '_' + h.pi + '_' + h.si) : ('g' + h.gi + 'p' + h.pi);
    if (!firstNodeId) firstNodeId = nodeId;
    const div = document.createElement('div');
    div.className = 'hit';
    const delHtml = READ_ONLY ? '' : (h.son
      ? `<div><span class="delBtn" onclick="clearSon(${h.gi},${h.pi},${h.si})">删除此记录（恢复占位）</span></div>`
      : `<div><span class="delBtn" onclick="delPerson(${h.gi},${h.pi})">删除此人</span></div>`);
    const isAdopt = h.son ? !!h.son.adopt : !!h.p.adopt;
    div.innerHTML = `<b>${esc(name)}</b>${isAdopt ? '<span class="adoptTag">继子</span>' : ''}（${esc(h.g.title)}）<br>` +
        (h.p.fson ? `${esc(h.p.fson)}之子<br>` : '') +
        (h.p.post ? `职位：${esc(h.p.post)}<br>` : '') +
      `配偶：${esc(h.son ? (h.p.spouse || '未录') : (h.p.spouse || '未录'))}<br>` +
        (h.p.zi ? `字：${esc(h.p.zi)}<br>` : '') +
      (h.p.birth || h.p.death ? `生卒：${esc([h.p.birth, h.p.death].filter(Boolean).join(' – '))}<br>` : '') +
      (h.p.note ? `备注：${esc(h.p.note)}<br>` : '') +
      (h.son
        ? `父：${esc(h.p.givenName)}（${esc(h.g.title)}）`
        : `子嗣：${kidsLabel(ks)}（${(h.p.sons || []).map((s, i) => s.givenName || ordOfSons(h.gi, h.pi, i) + '（待录）').join('、')}）`) +
      `<div><span class="delBtn locateBtn" onclick="scrollToNode('${nodeId}', true)">📍 定位到树上位置</span></div>` +
      delHtml;
    box.appendChild(div);
  });
  /* 查询即定位：视图自动滚动到第一条结果的位置（弹窗保持打开，方便换关键词） */
  scrollToNode(firstNodeId, false);
}

function delPerson(gi, pi) {
  const g = DATA.generations[gi];
  if (!g) return;

  if (!confirm(`确定删除「${p.givenName}」（${g.title}）吗？\n其在父系子嗣条目中的名字将恢复为占位。`)) return;
  // 只把「认领本人」的那条父系条目恢复占位；不得动其他同名人物的条目
  // （旧版按名字全局清空，删除一个「兴」会把始祖支系等所有同名连线一起误清）
  const claim = findClaimingEntry(gi, pi);
  if (claim) {
    const fg = DATA.generations[claim.fgi];
    const fp = fg && fg.people[claim.fpi];
    const se = fp && (fp.sons || [])[claim.si];
    if (se && se.givenName === p.givenName) { se.givenName = ''; se.sex = 'm'; delete se.adopt; }
  }
  g.people.splice(pi, 1);
  saveData();
  closeDlg();
  render();
}

/* 兄弟排序：在父亲子嗣数组中左右换位。
   数组顺序 = 长幼顺序：首位最长、显示最右；dir=-1 右移（更年长），dir=+1 左移（更年幼） */
function reorderSibling(dir) {
  if (!EDITING) return;
  const g = DATA.generations[EDITING.gi];
  const p = g && g.people[EDITING.pi];
  if (!p) return;
  const claim = findClaimingEntry(EDITING.gi, EDITING.pi);
  let f = claim ? (DATA.generations[claim.fgi] || {}).people[claim.fpi] : null;
  if (!f) { alert('该成员未挂父系，无法参与兄弟排序。'); return; }
  const si = f.sons.findIndex(s => s.givenName === p.givenName);
  const ns = si + dir;
  if (si < 0) return;
  if (ns < 0) { alert('已经在最右（最年长）了。'); return; }
  if (ns >= f.sons.length) { alert('已经在最左（最年幼）了。'); return; }
  const t = f.sons[si]; f.sons[si] = f.sons[ns]; f.sons[ns] = t;
  saveData(); render();
}

/* 世代/父亲修改：把该人物连同其已录名后代整支迁往目标世代 */
function movePersonSubtree(person, fromGi, toGi) {
  if (fromGi === toGi) return;
  while (DATA.generations.length <= toGi) {
    DATA.generations.push({ title: genTitleOf(DATA.generations.length + 1), people: [] });
  }
  const fromG = DATA.generations[fromGi];
  if (fromG) {
    const idx = fromG.people.indexOf(person);
    if (idx >= 0) fromG.people.splice(idx, 1);
  }
  DATA.generations[toGi].people.push(person);
  (person.sons || []).forEach(s => {
    if (!s.givenName) return;
    const childGen = DATA.generations[fromGi + 1];
    if (!childGen) return;
    const child = childGen.people.find(x => x.givenName === s.givenName);
    if (child) movePersonSubtree(child, fromGi + 1, toGi + 1);
  });
}

/* 守卫：候选父亲不能是自己或自己的后代（否则树上成环） */
function isSelfOrDescendant(person, gi, candidate) {
  if (candidate === person) return true;
  const seen = new Set();
  const visit = (p, g) => {
    (p.sons || []).forEach(s => {
      if (!s.givenName) return;
      const cg = DATA.generations[g + 1];
      if (!cg) return;
      const child = cg.people.find(x => x.givenName === s.givenName);
      if (child && !seen.has(child)) {
        seen.add(child);
        visit(child, g + 1);
      }
    });
  };
  visit(person, gi);
  return seen.has(candidate);
}

function submitEdit(gi, pi, oldFatherVal) {
  const g = DATA.generations[gi];
  if (!g) return;
  const p = g.people[pi];
  if (!p) return;
  const oldName = p.givenName;
  /* 必须在改 p.givenName 之前确定「认领本人」的父系条目（认领按名字匹配，改名后找不到） */
  const claim0 = findClaimingEntry(gi, pi);
  const name = document.getElementById('aName').value.trim();
  const spouse = document.getElementById('aSpouse').value.trim();
  const note = document.getElementById('aNote').value.trim();
  const sexEl = document.querySelector('input[name="asex"]:checked');
  const sex = sexEl ? sexEl.value : 'm';
  if (!name) { alert('请填写姓名'); return; }

  /* —— 先做守卫：父亲不能是自己或自己的后代（避免半保存状态）—— */
  const genVal = document.getElementById('aGen').value;
  let fatherVal = document.getElementById('aFather').value;
  if (fatherVal) {
    const [nfg0, nfp0] = fatherVal.split(':').map(Number);
    const nf0 = DATA.generations[nfg0] && DATA.generations[nfg0].people[nfp0];
    if (nf0 && isSelfOrDescendant(p, gi, nf0)) {
      alert(`不能把「${nf0.givenName}」设为父亲：那是本人或本人的后代，会让世系成环。`);
      render();
      return;
    }
  }

  p.givenName = name;
  p.spouse = spouse;
  p.note = note;
  p.sex = sex;
  p.birth = document.getElementById('aBirth').value.trim();
  p.death = document.getElementById('aDeath').value.trim();
  /* 字（古代表字）：有值保存，清空则移除 */
  const ziVal = document.getElementById('aZi').value.trim();
  if (ziVal) p.zi = ziVal; else delete p.zi;
  /* 之子（古谱系联）：只存父名（自动剥离"之子"后缀），展示时补全 */
  const fsonVal = document.getElementById('aFson').value.trim().replace(/之子$/, '');
  if (fsonVal) p.fson = fsonVal; else delete p.fson;
  /* 职位（官职/功名等）：有值保存，清空则移除 */
  const postVal = document.getElementById('aPost').value.trim();
  if (postVal) p.post = postVal; else delete p.post;
  const adoptEl = document.getElementById('aAdopt');
  if (adoptEl && adoptEl.checked) p.adopt = true; else delete p.adopt;
  /* 标记（绝子/失传/烈士等）：有值保存，清空则移除 */
  const tagVal = document.getElementById('aTag').value.trim();
  if (tagVal) p.tag = tagVal; else delete p.tag;
  // 若改名，同步更新父系子嗣条目中的名字与性别
  // 只改「认领本人」的那条条目，不碰其他同名人物的条目
  if (name !== oldName && claim0) {
    const fgR = DATA.generations[claim0.fgi];
    const fpR = fgR && fgR.people[claim0.fpi];
    const se = fpR && (fpR.sons || [])[claim0.si];
    if (se && se.givenName === oldName) { se.givenName = name; se.sex = sex; if (p.adopt) se.adopt = true; else delete se.adopt; }
  }

  /* —— 所属世代 / 父亲调整（genVal/fatherVal 已在上方守卫处读取）—— */
  if (oldFatherVal === undefined) {
    // 兼容直接调用：自动识别当前父系（用改名前确定的认领条目）
    oldFatherVal = '';
    if (claim0) oldFatherVal = claim0.fgi + ':' + claim0.fpi;
  }
  const chosenGen = genVal === 'new' ? DATA.generations.length : parseInt(genVal, 10);
  let effGen = chosenGen;

  if (fatherVal) {
    const [nfg, nfp] = fatherVal.split(':').map(Number);
    const nf = DATA.generations[nfg] && DATA.generations[nfg].people[nfp];
    if (!nf) {
      effGen = chosenGen;
    } else {
      effGen = nfg + 1;   // 父亲下一世
      if (fatherVal !== oldFatherVal) linkFather(fatherVal, p.givenName, p.sex);
      if (chosenGen !== effGen) {
        alert(`父亲为「${nf.givenName}」，所属世代已自动对齐为${genTitleOf(effGen)}。`);
      }
    }
  }
  // 换父亲：从旧父亲子嗣条目中移除
  if (oldFatherVal && oldFatherVal !== fatherVal) {
    const [ofg, ofp] = oldFatherVal.split(':').map(Number);
    const of = DATA.generations[ofg] && DATA.generations[ofg].people[ofp];
    if (of && Array.isArray(of.sons)) {
      const eidx = of.sons.findIndex(s => s.givenName === p.givenName);
      if (eidx >= 0) of.sons.splice(eidx, 1);
    }
  }
  // 世代移动（已录名后代整支随迁）
  if (effGen !== gi) movePersonSubtree(p, gi, effGen);

  // 继子标记同步到父亲子嗣条目（含未换父亲、只勾选/取消勾选的情况）
  if (fatherVal) {
    const [afg, afp] = fatherVal.split(':').map(Number);
    const af = DATA.generations[afg] && DATA.generations[afg].people[afp];
    if (af && Array.isArray(af.sons)) {
      const ae = af.sons.find(s => s.givenName === p.givenName);
      if (ae) { if (p.adopt) ae.adopt = true; else delete ae.adopt; }
    }
  }

  saveData();
  closeDlg();
  render();
}

/* 查找同名正式人物（用于重名提醒/合并） */
function findDuplicates(name) {
  const list = [];
  DATA.generations.forEach((g, gi) => g.people.forEach((p, pi) => {
    if (p.givenName === name) list.push({ g, gi, pi, p });
  }));
  return list;
}

function submitAdd() {
  const name = document.getElementById('aName').value.trim();
  const spouse = document.getElementById('aSpouse').value.trim();
  const birth = document.getElementById('aBirth').value.trim();
  const death = document.getElementById('aDeath').value.trim();

  const adoptEl = document.getElementById('aAdopt');
  const adopt = !!(adoptEl && adoptEl.checked);
  const genVal = document.getElementById('aGen').value;
  const fatherVal = document.getElementById('aFather').value;
  if (!name) { alert('请填写姓名'); return; }

  /* ---------- 重名检测：提醒是否合并 ---------- */
  const dups = findDuplicates(name);
  if (dups.length) {
    const ok = confirm(
      `名字「${name}」在族谱中已存在（共 ${dups.length} 处），可能是同一人。\n\n` +
      `· 点「确定」= 需要合并：不新建，补全到已有记录并接上父系\n` +
      `· 点「取消」= 无需合并：仍作为新成员添加到所选位置`
    );
    if (ok) { mergeIntoExisting(name, spouse, note, genVal, fatherVal, sex, ADD_SI, birth, death, adopt); return; }
    // 否则继续往下 → 新建
  }

  reallyAdd(name, spouse, note, genVal, fatherVal, sex, ADD_SI, birth, death, adopt);
}

/* 真正新建一个成员到所选位置 */
function reallyAdd(name, spouse, note, genVal, fatherVal, sex, si, birth, death, adopt) {
  const person = {
    givenName: name, spouse: spouse, note: note,
    sons: [], sex: sex,
    birth: birth || '', death: death || '',
  };
  if (adopt) person.adopt = true;
  /* 添加顺序号：无父系新成员按此排序（越后加越靠画布左）；老数据无此号视为最早 */
  if (DATA.aseqNext == null) DATA.aseqNext = 1;
  person.aseq = DATA.aseqNext++;
  /* 字（古代表字）：有值才写入 */
  const ziEl = document.getElementById('aZi');
  const ziVal = ziEl ? ziEl.value.trim() : '';
  if (ziVal) person.zi = ziVal;
  /* 之子（古谱系联，只填父名如"太"，自动剥离手滑带上的"之子"后缀） */
  const fsonEl = document.getElementById('aFson');
  const fsonVal = fsonEl ? fsonEl.value.trim().replace(/之子$/, '') : '';
  if (fsonVal) person.fson = fsonVal;
  /* 职位（官职/功名等）：有值才写入 */
  const postEl = document.getElementById('aPost');
  const postVal = postEl ? postEl.value.trim() : '';
  if (postVal) person.post = postVal;
  /* 标记（绝子/失传/烈士等）：有值才写入 */
  const tagEl = document.getElementById('aTag');
  const tagVal = tagEl ? tagEl.value.trim() : '';
  if (tagVal) person.tag = tagVal;
  /* 添加页与编辑页统一：步进器草稿计数写入新人物 */
  if (ADD_COUNTS.sons > 0) person.sonCount = ADD_COUNTS.sons;
  if (ADD_COUNTS.daughters > 0) person.daughterCount = ADD_COUNTS.daughters;
  let targetGi;
  if (genVal === 'new') {
    DATA.generations.push({ title: genTitleOf(DATA.generations.length + 1), people: [] });
    targetGi = DATA.generations.length - 1;
  } else {
    targetGi = parseInt(genVal, 10);
  }
  DATA.generations[targetGi].people.push(person);
  linkFather(fatherVal, name, sex, si, adopt);
  saveData();
  closeDlg();
  render();
}

/* 合并到已有同名记录（不新建，补全信息并接上父系） */
function mergeIntoExisting(name, spouse, note, genVal, fatherVal, sex, si, birth, death, adopt) {
  let target = null;
  for (const g of DATA.generations) {
    const p = g.people.find(x => x.givenName === name);
    if (p) { target = p; break; }
  }
  if (!target) {
    // 无同名正式记录（只是占位名重复）→ 直接新建
    alert('未找到可合并的同名正式记录，将作为新成员添加。');
    reallyAdd(name, spouse, note, genVal, fatherVal, sex, si, birth, death, adopt);
    return;
  }
  if (spouse && !target.spouse) target.spouse = spouse;
  if (note && !target.note) target.note = note;
  if (birth && !target.birth) target.birth = birth;
  if (death && !target.death) target.death = death;
  if (target.sex == null) target.sex = sex;
  if (adopt) target.adopt = true;
  linkFather(fatherVal, name, sex, si, adopt);
  saveData();
  closeDlg();
  render();
  alert(`已将「${name}」合并到已有记录，并补全相关信息、接上父系关联。`);
}

/* 把某成员关联到父亲子嗣条目（子嗣位全部是「子」，绝不占用女性条目） */
function linkFather(fatherVal, name, sex, si, adopt) {
  if (!fatherVal) return;
  const [fgi, fpi] = fatherVal.split(':').map(Number);
  const f = DATA.generations[fgi] && DATA.generations[fgi].people[fpi];
  if (!f) return;
  if (!Array.isArray(f.sons)) f.sons = [];
  const mark = e => { if (adopt) e.adopt = true; };
  if (f.sons.some(s => s.givenName === name)) {
    /* 同名条目已存在。特例：同胞同名——下一世同名正式人物多于已有同名条目时，
       说明确实有两个同名儿子（如第十四世两个「明」），允许再挂一条同名条目 */
    const nextGen = DATA.generations[fgi + 1];
    const formalCnt = nextGen ? nextGen.people.filter(x => x.givenName === name).length : 0;
    const entryCnt = f.sons.filter(s => s.givenName === name).length;
    if (entryCnt < formalCnt) {
      f.sons.push({ givenName: name, sex: sex, adopt: adopt ? true : undefined });
      return;
    }
    if (adopt) { const e0 = f.sons.find(s => s.givenName === name); if (e0) e0.adopt = true; }
    return;   // 已挂在该父亲名下，避免重复
  }
  // 从占位点击进入：精确绑定到所点的那个儿子槽位
  if (si != null && f.sons[si] && !f.sons[si].givenName && f.sons[si].sex !== 'f') {
    f.sons[si].givenName = name;
    f.sons[si].sex = sex;
    mark(f.sons[si]);
    return;
  }
  // 弹窗新增（未点具体槽位）：只填「末尾连续空位」，否则追加到数组末尾。
  // 数组顺序 = 长幼顺序（首位最长、显示最右）；追加 = 最幼，显示在最左，
  // 绝不插到已录名兄长前面的空位里，避免破坏「长子最右、依次往左」。
  let tail = f.sons.length;
  while (tail > 0 && !f.sons[tail - 1].givenName && f.sons[tail - 1].sex !== 'f') tail--;
  if (tail < f.sons.length) { f.sons[tail].givenName = name; f.sons[tail].sex = sex; mark(f.sons[tail]); }
  else f.sons.push({ givenName: name, sex: sex, adopt: adopt ? true : undefined });
}
function genTitleOf(n) {
  const CN = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','二十一','二十二','二十三','二十四','二十五'];
  return '第' + (CN[n - 1] || n) + '世';
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- 备份 / 恢复（把含录入内容的数据保存为文件） ---------- */
/* ---------- 备份数据：绑定固定文件后自动保存，不弹另存框 ----------
   原理：首次点「备份数据」选一次保存位置（仅此一次），文件句柄存入 IndexedDB；
   之后每次备份/数据改动都直接写入该文件，浏览器不再弹任何对话框。 */
let backupHandle = null;
let autoBakTimer = null;
let toastTimer = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function idbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('zupu_fs', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return await new Promise(res => {
      const r = db.transaction('handles').objectStore('handles').get(key);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function idbSet(key, val) {
  try {
    const db = await idbOpen();
    await new Promise(res => {
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(val, key);
      tx.oncomplete = res;
      tx.onerror = () => res();
    });
  } catch (e) {}
}

async function writeBackupFile(h) {
  const w = await h.createWritable();
  await w.write(JSON.stringify(DATA, null, 2));
  await w.close();
}

/* 数据改动后 1.5 秒防抖，静默自动备份（权限未授予则跳过，绝不弹框打扰） */
function scheduleAutoBackup() {
  if (!window.indexedDB || !window.showSaveFilePicker) return;
  if (autoBakTimer) clearTimeout(autoBakTimer);
  autoBakTimer = setTimeout(async () => {
    try {
      const h = backupHandle || await idbGet('backup');
      if (!h) return;
      backupHandle = h;
      if (await h.queryPermission({ mode: 'readwrite' }) === 'granted') {
        await writeBackupFile(h);
      }
    } catch (e) {}
  }, 1500);
}

/* ---------- 每5分钟自动快照：另存独立文件夹，特殊情况可直接恢复 ----------
   优先写入用户绑定的快照文件夹（时间戳文件名，保留最近30份，超过自动清理）；
   浏览器不支持文件夹写入时兜底存浏览器内部（保留最近10份，可从菜单恢复）。 */
let snapDirHandle = null;
let snapTimer = null;
let lastSnapJson = '';
const SNAP_KEEP = 30;
const SNAP_KEY = 'zupu_autosnaps';

function snapStamp(d) {
  const p = n => String(n).padStart(2, '0');
  return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}
function listInternalSnaps() {
  try { return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]'); } catch (e) { return []; }
}
function saveInternalSnap(name, json) {
  try {
    const arr = listInternalSnaps();
    arr.unshift({ ts: Date.now(), name, json });
    while (arr.length > 10) arr.pop();
    localStorage.setItem(SNAP_KEY, JSON.stringify(arr));
    return true;
  } catch (e) { return false; }
}
async function pruneSnapDir() {
  if (!snapDirHandle) return;
  const names = [];
  for await (const entry of snapDirHandle.values()) {
    if (entry.kind === 'file' && entry.name.startsWith('族谱自动快照_')) names.push(entry.name);
  }
  names.sort().reverse();
  for (const name of names.slice(SNAP_KEEP)) {
    try { await snapDirHandle.removeEntry(name); } catch (e) {}
  }
}
async function autoSnapshot(force) {
  const json = JSON.stringify(DATA, null, 2);
  if (!force && json === lastSnapJson) return;   // 数据没变不重复快照
  lastSnapJson = json;
  const name = '族谱自动快照_' + snapStamp(new Date()) + '.json';
  if (snapDirHandle) {
    try {
      const fh = await snapDirHandle.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(json);
      await w.close();
      await pruneSnapDir();
      showToast('已自动快照到文件夹（' + name + '）');
      return;
    } catch (e) { /* 文件夹写入失败 → 内部兜底 */ }
  }
  if (saveInternalSnap(name, json)) showToast('已自动快照到浏览器内部（' + name + '）');
}
function startSnapTimer() {
  if (snapTimer) return;
  snapTimer = setInterval(() => autoSnapshot(false), 5 * 60 * 1000);
}
async function bindSnapDir() {
  if (!window.showDirectoryPicker) {
    startSnapTimer();
    alert('当前浏览器不支持选择文件夹。\n已启用浏览器内部快照：每5分钟一次，保留最近10份，可通过菜单「⏱ 自动快照」恢复。');
    return;
  }
  try {
    snapDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await idbSet('snapDir', snapDirHandle);
    lastSnapJson = '';
    await autoSnapshot(true);
    startSnapTimer();
    alert('自动快照已开启：每5分钟保存一份到所选文件夹（保留最近30份）。\n出现特殊情况时，用「恢复数据」选择任一快照文件即可还原。');
  } catch (e) { /* 用户取消选择 */ }
}
function restoreInternalSnap(i) {
  const arr = listInternalSnaps();
  const s = arr[i];
  if (!s) { alert('没有可恢复的内部快照'); return; }
  if (!confirm('恢复快照 ' + s.name + '？\n当前未备份的内容将被覆盖。')) return;
  try {
    const obj = JSON.parse(s.json);
    if (!obj || !Array.isArray(obj.generations)) throw new Error('bad');
    DATA = obj;
    saveData(); render(); closeDlg();
    alert('快照已恢复');
  } catch (e) { alert('快照格式错误'); }
}
async function openSnapTool() {
  if (snapDirHandle) {
    if (confirm('自动快照运行中：每5分钟写入所选文件夹，保留最近30份。\n\n确定 = 重新选择快照文件夹')) bindSnapDir();
    return;
  }
  const arr = listInternalSnaps();
  if (!window.showDirectoryPicker) {
    if (arr.length && confirm('当前浏览器不支持文件夹快照，已启用内部快照（' + arr.length + ' 份，最新：' + new Date(arr[0].ts).toLocaleString() + '）。\n\n确定 = 恢复最新内部快照')) restoreInternalSnap(0);
    else if (!arr.length) alert('当前浏览器不支持文件夹快照；内部快照将在数据变化后自动生成。');
    return;
  }
  if (arr.length && confirm('检测到浏览器内部自动快照（' + arr.length + ' 份，最新：' + new Date(arr[0].ts).toLocaleString() + '）。\n\n确定 = 恢复最新内部快照\n取消 = 绑定快照文件夹（每5分钟另存一份，保留30份）')) { restoreInternalSnap(0); return; }
  bindSnapDir();
}
/* 启动时找回上次绑定的快照文件夹（权限已授予则自动续跑） */
window.addEventListener('DOMContentLoaded', () => {
  (async () => {
    if (!window.showDirectoryPicker || !window.indexedDB) return;
    const h = await idbGet('snapDir');
    if (!h) return;
    try {
      if (await h.queryPermission({ mode: 'readwrite' }) === 'granted') {
        snapDirHandle = h;
        startSnapTimer();
      } else {
        showToast('请点菜单「⏱ 自动快照」以恢复自动快照权限');
      }
    } catch (e) {}
  })();
});

async function exportData() {
  closeDlg();
  try {
    let h = backupHandle || await idbGet('backup');
    if (h) {
      let perm = await h.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await h.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        backupHandle = h;
        await writeBackupFile(h);
        showToast('已自动备份到「' + h.name + '」');
        return;
      }
    }
    if (window.showSaveFilePicker) {
      // 仅第一次需要选一次保存位置（选到工作文档目录），之后全部静默自动保存
      h = await window.showSaveFilePicker({
        suggestedName: '族谱数据备份.json',
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
      });
      backupHandle = h;
      await idbSet('backup', h);
      await writeBackupFile(h);
      showToast('已绑定「' + h.name + '」，以后备份自动保存、不再弹框');
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;   // 用户主动取消选择
  }
  legacyDownload();   // 浏览器不支持文件句柄时的回退：仍走下载
}

function legacyDownload() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '族谱数据备份.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj || !Array.isArray(obj.generations)) throw new Error('格式错误');
      DATA = obj;
      saveData();
      render();
      closeDlg();
      alert('恢复成功');
    } catch (e) {
      alert('恢复失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ---------- 移动端：打开页面弹出操作菜单 ---------- */
function isMobile() {
  return window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
}
window.addEventListener('DOMContentLoaded', () => {
  render();
  if (READ_ONLY) {
    /* 发布版：移除所有编辑入口（添加/编辑/备份/恢复/菜单） */
    document.querySelectorAll('.editOnly').forEach(e => e.remove());
  } else if (isMobile()) {
    setTimeout(showMenu, 350);
  }
});
document.getElementById('mask').addEventListener('click', e => {
  if (e.target === document.getElementById('mask')) closeDlg();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDlg(); });
document.getElementById('treeWrap').addEventListener('scroll', updateGenFloat);
let rzTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => { render(); updateGenFloat(); }, 200);   // 窗口变化后画布重新撑满显示区
});
</script>
